[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[project]
name = "dspy_agent"
version = "0.0.1"
description = "A template for developing production-ready Python applications."
authors = [
  { name = "Miguel Villa Floran", email = "miguel.villafloran@gmail.com" },
]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "utils",
    "typer>=0.12.5",
    "dspy>=3.0.4",
    "dotenv>=0.9.9",
]

[tool.uv.sources]
dspy_agent = { workspace = true }

[dependency-groups]
dev = ["pre-commit>=4.1.0", "ipykernel>=6.29.5"]

[project.scripts]
dspy_agent = "dspy_agent.cli:entrypoint"
